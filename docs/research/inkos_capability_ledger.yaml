parity_rules:
  clean_room: true
  forbidden_in_hevi:
    - source_code
    - prompt_text
    - skill_text
    - tests
    - fixtures
    - templates
    - css_or_ui_assets
  accepted_evidence:
    - upstream_license_and_metadata
    - public_readme_behavior
    - CLI_help_and_json_contract
    - source_tree_capability_presence_without_copying_expression
    - HEVI_independent_tests
  final_gate:
    missing: 0
    partial: 0
    implemented_unqualified: 0
    required_classification: HEVI_3O_CREATIVE_RUNTIME_PRODUCTION_COMPLETE
