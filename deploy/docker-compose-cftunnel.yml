---
# hevi v6 — Cloudflare Tunnel 本地全栈部署
#
# 依赖: 平台 pg/minio 容器已在运行(hevi-dev-postgres-1 @ :5432, hevi-dev-minio-1 @ :9100)
# 不起 pg/minio/nginx/Redis 容器(obase.cache=文件系统 pickle)
#
# 起服务:
#   eval $(ssh-agent -s) && ssh-add ~/.ssh/id_ed25519
#   DOCKER_BUILDKIT=1 docker compose -f deploy/docker-compose-cftunnel.yml up -d --build
#
# 隧道目标(交 Wiki cloudflared 配置):
#   hevi-api : http://localhost:8201   →  https://api.hevi.kanpan.co  (或路径路由 /api/*)
#   hevi-web : http://localhost:3200   →  https://hevi.kanpan.co
#   注: 8200 与 tide-api 冲突,已改用 8201(2026-07-02)

name: hevi-cftunnel

services:
  # Voicebox 是解说/通鉴共用的本地 TTS sidecar。模型和 profile 独立持久化，
  # HEVI 只通过内网 HTTP 调用，不把 PyTorch/Qwen 依赖塞进 API 镜像。
  hevi-voicebox:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.voicebox
      args:
        PYTORCH_VARIANT: cpu
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      NUMBA_CACHE_DIR: /tmp/numba_cache
      VOICEBOX_BACKEND_VARIANT: cpu
      HF_HOME: /home/voicebox/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - voicebox-data:/app/data
      # The model is downloaded by the deployment host (through its proxy)
      # and mounted read-only. Runtime containers need no outbound network.
      - ../.voicebox-cache:/home/voicebox/.cache/huggingface/hub
    ports:
      - "127.0.0.1:17600:17493"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:17493/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  hevi-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    # GPU binding is temporarily disabled because the host NVIDIA runtime
    # references a stale driver library (580.159.03 vs host 580.173.02).
    # Cloud providers and CPU-safe paths remain available until runtime repair.
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql://hevi:hevi@host.docker.internal:5432/hevi
      MINIO_ENDPOINT: host.docker.internal:9100
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-hevi}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-hevi1234}
      MINIO_BUCKET: ${MINIO_BUCKET:-hevi-assets}
      CORS_ORIGINS: https://hevi.kanpan.co
      VIBEVOICE_MODEL_DIR: /models/vibevoice-1.5b
      WAN2GP_DIR: /Wan2GP
      HEVI_LLM_PROVIDER: qwen_local
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5vl:7b
      HEVI_EXPLAINER_TTS_PROVIDER: voicebox
      HEVI_AUDIO_PROVIDER: voicebox
      VOICEBOX_BASE_URL: http://hevi-voicebox:17493
      VOICEBOX_ENGINE: ${VOICEBOX_ENGINE:-qwen_custom_voice}
      VOICEBOX_MODEL_SIZE: ${VOICEBOX_MODEL_SIZE:-1.7B}
      VOICEBOX_PRESET_VOICE: ${VOICEBOX_PRESET_VOICE:-Dylan}
      VOICEBOX_PROFILE_ID: ${VOICEBOX_PROFILE_ID:-}
      VOICEBOX_INSTRUCT: ${VOICEBOX_INSTRUCT:-自然、沉稳、有呼吸感的中文纪录片解说，语气有轻微起伏，不要播音腔，不要机械停顿。}
      VOICEBOX_ALLOW_EDGE_FALLBACK: "0"
      # 断点续传:调研/确稿缓存落盘在宿主持久挂载(output),容器重建不丢。
      EXPLAINER_CACHE_DIR: /app/output/explainer_cache
    volumes:
      - /home/soffy/models:/models:ro
      - /home/soffy/Wan2GP:/Wan2GP:ro
      - /home/soffy/projects/hevi/output:/app/output
      # 主机已有的 HF 缓存(含 openai/clip-vit-base-patch32)只读挂进来,让
      # subjects/subject_embed.py 能算角色身份向量(local_files_only=True)——
      # 治"人物存了但没向量资产化",同时启用角色一致性 CLIP 打分。
      - /home/soffy/.cache/huggingface:/root/.cache/huggingface:ro
      # SDXL base + IP-Adapter + fp16 VAE 权重(settings.sdxl_model_dir 默认路径),
      # 让容器内 sdxl_local 关键帧引擎(engine="local")能加载模型在 GPU 上出锁脸/摆姿势
      # 关键帧——不挂则 engine=local 找不到权重、退回云端 edit(免费额度墙)→ canon。
      - /data/models/huggingface:/data/models/huggingface:ro
    ports:
      - "8201:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn hevi.api.main:app --host 0.0.0.0 --port 8000 --workers 1"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  hevi-web:
    build:
      context: ../hevi-web
      dockerfile: ../deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE: https://hevi.kanpan.co
        NEXT_PUBLIC_USE_MOCK: "false"
    restart: unless-stopped
    ports:
      - "3200:3000"
    depends_on:
      hevi-api:
        condition: service_healthy
    # Next.js 生产镜像不含 curl → 原 curl healthcheck 恒失败(假 unhealthy)。
    # 改用 node 自带 http 探活(node 必然存在)。
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    name: hevi-cftunnel_default
    external: true

volumes:
  voicebox-data:
