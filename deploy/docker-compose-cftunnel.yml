---
# hevi v6 — Cloudflare Tunnel 本地全栈部署
#
# 依赖: 平台 PostgreSQL/MinIO 已在运行。宿主端点由 CFTUNNEL_DATABASE_URL /
# CFTUNNEL_MINIO_ENDPOINT 覆盖；当前 Vault 默认分别是 :5441 / :9000。
# 不起 pg/minio/nginx/Redis 容器(obase.cache=文件系统 pickle)
#
# 起服务:
#   eval $(ssh-agent -s) && ssh-add ~/.ssh/id_ed25519
#   DOCKER_BUILDKIT=1 docker compose -f deploy/docker-compose-cftunnel.yml up -d --build
#
# 隧道目标(交 Wiki cloudflared 配置):
#   hevi-api : http://localhost:8201   →  https://api.hevi.kanpan.co  (或路径路由 /api/*)
#   hevi-web : http://localhost:3200   →  https://hevi.kanpan.co
#   注: 8200 与 tide-api 冲突,已改用 8201(2026-07-02)

name: hevi-cftunnel

services:
  hevi-api:
    build:
      # S8: 生产镜像只从固定发布 worktree /data/soffy/projects/hevi-release 构建，
      # 不依赖主仓库当前检出的分支。未设置时退回旧行为（仅限本地开发）。
      context: ${HEVI_RELEASE_ROOT:-..}
      dockerfile: deploy/Dockerfile.api
      # talkcraft 主播线的 chrome-headless-shell(Remotion 4.0.519 配套 149.0.7790.0),
      # 取宿主 vendor runtime 已下载的那份,构建/运行都不联网下载浏览器。
      additional_contexts:
        talkcraft_browser: ${HEVI_TALKCRAFT_BROWSER_DIR:-/data/soffy/projects/vendor/video-talkcraft/runtime/node_modules/.remotion}
      args:
        S16_BUILD_REV: ${S16_BUILD_REV:-dev}
        NPM_REGISTRY: ${HEVI_NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    # v9.1: 纯控制节点资源限制(防内存泄漏拖垮宿主)。GPU 不由本栈分配。
    deploy:
      resources:
        limits:
          cpus: '4.0'
          # comic_narration loads SD-Turbo on CPU (~3-4 GB peak); 4G OOM-killed it.
          memory: 10G
    # GPU 直通不在基础栈中强制申请；需要 Wan2GP 本地推理时使用
    # deploy/docker-compose-cftunnel.gpu.yml 覆盖层。
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: ${CFTUNNEL_DATABASE_URL:?CFTUNNEL_DATABASE_URL is required for production}
      MINIO_ENDPOINT: ${CFTUNNEL_MINIO_ENDPOINT:-host.docker.internal:9000}
      # MPT is a separate host-published stack; 127.0.0.1 inside this
      # container would point back to hevi-api rather than the MPT container.
      MPT_API_BASE: http://host.docker.internal:8080
      MPT_WEBUI_BASE: http://host.docker.internal:8501
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required for production}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required for production}
      MINIO_BUCKET: ${MINIO_BUCKET:-hevi-assets}
      REDIS_URL: redis://hevi-redis:6379/0
      APP_ENV: production
      CORS_ORIGINS: https://hevi.kanpan.co
      VIBEVOICE_MODEL_DIR: /models/vibevoice-1.5b
      WAN2GP_DIR: /Wan2GP
      HEVI_LLM_PROVIDER: qwen_local
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      # Canvas text review: host bridge proxy to OpenCode Zen (free model).
      # The proxy listens on the Docker bridge only; see deploy/llm-proxy/.
      OMNIROUTE_BASE_URL: http://host.docker.internal:20129/v1
      OMNIROUTE_MODEL: deepseek-v4.1-flash
      HEVI_CANVAS_LLM_CHANNEL: omniroute_free
      HEVI_CANVAS_LLM_TIMEOUT_S: "60"
      # 共享 RTX 3080 上另有租户常占 ~2.4GiB,不加这个 sdxl_local 关键帧 VAE decode 峰值会
      # CUDA OOM(2026-07-16 实证:加此 env 后本地出图/img2img 才成)。缺它 → engine=local
      # 关键帧全挂、退云端额度墙 → canon,v1/v2 关键帧路(含 SPEC-004 v2 朝向 img2img)全废。
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      # 消耗单价:credits_per_usd 默认 100(estimated_credits = cost_usd × 此值)。这台是 soffy
      # 自用测试实例,降到 10(每次产集扣的积分 1/10),配合手动授信足够反复测,不受额度墙卡。
      CREDITS_PER_USD: "10"
      # INC-002:每镜 LLM 生成 performance_track(镜头内部表演时间轴)的密度档。L2=eyeline+情绪+
      # 面部生理+运镜曲线。每镜一次 LLM 调用(并发,后台路径),分镜生成会明显变慢+花钱。见
      # config.performance_track_tier。不想填时删掉这行或设 L0。
      PERFORMANCE_TRACK_TIER: "L2"
      # wave2: 最小准入 scope(仅免费/本地 provider,低 ceiling,无任何付费 provider)。
      # tenant 取值 = 任务提交时 caller 声明的 workspace_id,已用真实测试账号提交观测。
      # targets/capabilities 留空: /tasks 路径的 production_source 为空,具名 targets 会拒掉它。
      ADMISSION_TENANT_SCOPES: "wave2-test-ws|wan_local,ltx2_local,qwen_local,local|||render|1.0"
      HEVI_EXPLAINER_TTS_PROVIDER: piper
      HEVI_AUDIO_PROVIDER: piper
      TALKING_FACE_ENGINE: generic
      # v9.1: AI 引擎统一地址(CosyVoice/LongCat/voicebox TTS 同源)。
      HEVI_ASSET_ROOT: /app/data/workspace/assets
      HEVI_OUTPUT_ROOT: /app/output
      VOICEBOX_ENGINE: ${VOICEBOX_ENGINE:-qwen_custom_voice}
      VOICEBOX_MODEL_SIZE: ${VOICEBOX_MODEL_SIZE:-1.7B}
      VOICEBOX_PRESET_VOICE: ${VOICEBOX_PRESET_VOICE:-Dylan}
      VOICEBOX_PROFILE_ID: ${VOICEBOX_PROFILE_ID:-}
      VOICEBOX_INSTRUCT: ${VOICEBOX_INSTRUCT:-自然、沉稳、有呼吸感的中文纪录片解说，语气有轻微起伏，不要播音腔，不要机械停顿。}
      VOICEBOX_ALLOW_EDGE_FALLBACK: "0"
      # 断点续传:调研/确稿缓存落盘在宿主持久挂载(output),容器重建不丢。
      EXPLAINER_CACHE_DIR: /app/output/explainer_cache
      # P1/P2: 教材 KU 主线查询(mneme 在宿主机 5433)
      MNEME_DATABASE_URL: ${MNEME_DATABASE_URL:-}
      # 零成本线引擎(docs/ZEROLINES.md):11 条 zero 线默认走 CPU 本地管线
      # (Piper TTS + Pexels 免费素材 + PIL + faster-whisper),订单槽 engine 仍可显式覆盖。
      HEVI_LINE_ENGINE: ${HEVI_LINE_ENGINE:-zero}
      HEVI_LAUNCH_LINES: ${HEVI_LAUNCH_LINES:-collage_broll,koubo_cut,explainer,talking_head,history_scene,cinematic,avatar_spokesperson,kinetic_promo,director_pipeline,comic_narration,documentary_montage,shorts_clip,podcast_repurpose,scene3d,handdraw,localization_dub,reference_adapt,character_animation}
      HEVI_OFFLINE_MT_DIR: ${HEVI_OFFLINE_MT_DIR:-/models/argos}
      HEVI_HYPERFRAMES_BIN: ${HEVI_HYPERFRAMES_BIN:-/node26/bin/hyperframes}
      HEVI_PIPER_VOICE: ${HEVI_PIPER_VOICE:-/opt/piper/voices/zh_CN-huayan-medium.onnx}
      HEVI_LAUNCH_STRICT: ${HEVI_LAUNCH_STRICT:-1}
      # S13: optional internal raea check bypass (default off; skipped when the
      # binary is absent).  Kinetic promo stays on the default engine unless
      # explicitly switched for an A/B (no automatic switch).
      HEVI_RAEA_CHECK: ${HEVI_RAEA_CHECK:-0}
      HEVI_KINETIC_ENGINE: ${HEVI_KINETIC_ENGINE:-default}
      HEVI_TALKCRAFT_PIPER: /opt/piper/bin/piper
      HEVI_TALKCRAFT_VOICES: /opt/piper/voices
      HEVI_WHISPER_MODEL: /models/faster-whisper-large-v3-turbo
      FASTER_WHISPER_MODEL_DIR: /models/faster-whisper-large-v3-turbo
      # rembg/koubo 素材抠图用宿主已有的 u2net.onnx(176MB),只读挂载,禁止运行期下载 1GB bria
      U2NET_HOME: /u2net
      HEVI_ZERO_CACHE: /app/.cache/hevi/zerolines
      # talkcraft 主播线(talking_head / avatar_spokesperson 订单 renderer=talkcraft):
      # Remotion 子工程在镜像内 /app/hevi-remotion-talkcraft;Wav2Lip-GAN-96 + yoloface ONNX
      # 与 faster-whisper 走 /models 只读挂载(宿主 /home/soffy/models);node 用镜像 /usr/bin。
      HEVI_TALKCRAFT_REMOTION: /app/hevi-remotion-talkcraft
      HEVI_TALKCRAFT_AVATAR_MODELS: /models/wav2lip
      HEVI_TALKCRAFT_WHISPER: /models/faster-whisper-large-v3-turbo
      HEVI_NODE_BIN: /usr/bin
      HEVI_TALKCRAFT_THREADS: "2"
      # LivLiv 2.5D avatar engine (engine=livliv / avatar_engine=livliv).
      # Characters are non-commercial use only (see hevi/avatar_livliv/licenses);
      # the player + characters and a Chromium with WebGL2 are mounted read-only.
      LIVLIV_CHARACTERS_ENABLED: "true"
      HEVI_LIVLIV_VENDOR: /livliv
      HEVI_LIVLIV_CHROME: /pwbrowsers/chromium-1248/chrome-linux64/chrome
      HEVI_LIVLIV_TMP: /app/.cache/hevi/livliv
      HEVI_LIVLIV_WORKERS: ${HEVI_LIVLIV_WORKERS:-1}
      HEVI_LIVLIV_BATCH: ${HEVI_LIVLIV_BATCH:-12}
      # scene3d renders Three.js through Playwright + the host Chromium bundle
      # mounted at /pwbrowsers (read-only). The pinned build may differ, so the
      # renderer launches that binary explicitly.
      SCENE3D_PLAYWRIGHT_BROWSERS: /pwbrowsers
      # comic_narration keyframes (SD-Turbo CPU) live outside the /models tree.
      HEVI_SD_TURBO_PATH: /sdmodels/models/AI-ModelScope--sd-turbo/snapshots/master
      HEVI_TAESD_PATH: /sdmodels/models/madebyollin--taesd/snapshots/master
      # open_clip candidate scoring (host ~/models is mounted at /models, not
      # at the hard-coded /home/soffy/models path used on the host).
      HEVI_OPEN_CLIP_DIR: /models/open_clip
    volumes:
      - /home/soffy/models:/models:ro
      # SD-Turbo / TAESD for comic_narration (host /data/soffy/models/ms)
      - /data/soffy/models/ms:/sdmodels:ro
      - /home/soffy/.u2net:/u2net:ro
      # 零成本线 Piper 音色(zh_CN-huayan-medium / en_US-ryan-medium),宿主只读
      - ${HEVI_PIPER_VOICES_DIR:-/data/soffy/projects/hevi-zero/voices}:/opt/piper/voices:ro
      # 零成本线缓存(Pexels 素材/whisper 中间件),容器重建不丢
      - hevi-zero-cache:/app/.cache/hevi/zerolines
      - /home/soffy/Wan2GP:/Wan2GP:ro
      - /home/soffy/projects/hevi/output:/app/output
      # v9.1: 任务沙盒 + SQLite 任务库(data/hevi_tasks.db)持久化到宿主机,
      # 容器重建不丢进度,大盘/WebSocket 可读可下载。
      - /home/soffy/projects/hevi/data:/app/data
      - /home/soffy/projects/hevi/assets:/app/assets
      - /home/soffy/.nvm/versions/node/v26.4.0:/node26:ro
      - /home/soffy/.cache/hyperframes:/app/.cache/hyperframes:ro
      # LivLiv 2.5D avatar: vendor player+characters (214MB) and a Chromium with
      # WebGL2 (SwiftShader). Both read-only; never baked into the image.
      - /data/soffy/vendor/livliv-player:/livliv:ro
      - /home/soffy/.cache/ms-playwright:/pwbrowsers:ro
      # wave2: 其余 5 处主仓单文件覆盖已随代码移植进镜像而删除。仅 scene_render_avatar
      # 保留挂载:两版已实质分叉(40+ 处差异),直接去挂载会静默换掉通鉴 avatar 实现,合并另立项。
      - /home/soffy/projects/hevi/hevi/tongjian/scene_render_avatar.py:/app/hevi/tongjian/scene_render_avatar.py:ro
      # 主机已有的 HF 缓存(含 openai/clip-vit-base-patch32)只读挂进来,让
      # subjects/subject_embed.py 能算角色身份向量(local_files_only=True)——
      # 治"人物存了但没向量资产化",同时启用角色一致性 CLIP 打分。
      - /home/soffy/.cache/huggingface:/root/.cache/huggingface:ro
      # SDXL base + IP-Adapter + fp16 VAE 权重(settings.sdxl_model_dir 默认路径),
      # 让容器内 sdxl_local 关键帧引擎(engine="local")能加载模型在 GPU 上出锁脸/摆姿势
      # 关键帧——不挂则 engine=local 找不到权重、退回云端 edit(免费额度墙)→ canon。
      - /data/models/huggingface:/data/models/huggingface:ro
    ports:
      - "8201:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hevi-redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade heads &&
             uvicorn hevi.api.main:app --host 0.0.0.0 --port 8000 --workers 1"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  hevi-web:
    build:
      # S8: 同 hevi-api，生产 web 也从固定发布 worktree 构建。
      context: ${HEVI_RELEASE_ROOT:-..}/hevi-web
      dockerfile: ${HEVI_RELEASE_ROOT:-..}/deploy/Dockerfile.web
      args:
        NPM_REGISTRY: ${HEVI_NPM_REGISTRY:-https://registry.npmmirror.com}
        NEXT_PUBLIC_DEPLOY_ENV: production
        NEXT_PUBLIC_API_BASE: https://hevi.kanpan.co
        NEXT_PUBLIC_USE_MOCK: "false"
    restart: unless-stopped
    ports:
      - "3200:3000"
    depends_on:
      hevi-api:
        condition: service_healthy
    # Next.js 生产镜像不含 curl → 原 curl healthcheck 恒失败(假 unhealthy)。
    # 改用 node 自带 http 探活(node 必然存在)。
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  # wave2: 正式 redis 服务(替代此前与 api 共享网络命名空间的临时容器)。
  hevi-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hevi-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # wave2: worker/scheduler 由 compose 正式承载(此前为 docker run 临时容器)。
  # healthcheck 覆盖掉 api 的 curl :8000(worker/scheduler 内无 uvicorn,原探活恒误报):
  # 改为校验 1 号进程命令行确为本服务入口。
  hevi-worker:
    image: hevi-cftunnel-hevi-api:latest
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      REDIS_URL: redis://hevi-redis:6379/0
      DATABASE_URL: ${CFTUNNEL_DATABASE_URL:?CFTUNNEL_DATABASE_URL is required for production}
      MINIO_ENDPOINT: ${CFTUNNEL_MINIO_ENDPOINT:-host.docker.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required for production}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required for production}
      MINIO_BUCKET: ${MINIO_BUCKET:-hevi-assets}
      MNEME_DATABASE_URL: ${MNEME_DATABASE_URL:-}
      MPT_API_BASE: http://host.docker.internal:8080
      MPT_WEBUI_BASE: http://host.docker.internal:8501
      APP_ENV: production
      ADMISSION_TENANT_SCOPES: "wave2-test-ws|wan_local,ltx2_local,qwen_local,local|||render|1.0"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      OMNIROUTE_BASE_URL: http://host.docker.internal:20129/v1
      OMNIROUTE_MODEL: deepseek-v4.1-flash
      HEVI_CANVAS_LLM_CHANNEL: omniroute_free
      HEVI_CANVAS_LLM_TIMEOUT_S: "60"
      HEVI_EXPLAINER_TTS_PROVIDER: piper
      HEVI_AUDIO_PROVIDER: piper
      TALKING_FACE_ENGINE: generic
      HEVI_LINE_ENGINE: ${HEVI_LINE_ENGINE:-zero}
      HEVI_LAUNCH_LINES: ${HEVI_LAUNCH_LINES:-collage_broll,koubo_cut,explainer,talking_head,history_scene,cinematic,avatar_spokesperson,kinetic_promo,director_pipeline,handdraw,localization_dub,reference_adapt,character_animation}
      HEVI_OFFLINE_MT_DIR: ${HEVI_OFFLINE_MT_DIR:-/models/argos}
      HEVI_HYPERFRAMES_BIN: ${HEVI_HYPERFRAMES_BIN:-/node26/bin/hyperframes}
      HEVI_PIPER_VOICE: ${HEVI_PIPER_VOICE:-/opt/piper/voices/zh_CN-huayan-medium.onnx}
      HEVI_LAUNCH_STRICT: ${HEVI_LAUNCH_STRICT:-1}
      HEVI_TALKCRAFT_PIPER: /opt/piper/bin/piper
      HEVI_TALKCRAFT_VOICES: /opt/piper/voices
      HEVI_WHISPER_MODEL: /models/faster-whisper-large-v3-turbo
      FASTER_WHISPER_MODEL_DIR: /models/faster-whisper-large-v3-turbo
      # rembg/koubo 素材抠图用宿主已有的 u2net.onnx(176MB),只读挂载,禁止运行期下载 1GB bria
      U2NET_HOME: /u2net
      HEVI_ZERO_CACHE: /app/.cache/hevi/zerolines
      HEVI_TALKCRAFT_REMOTION: /app/hevi-remotion-talkcraft
      HEVI_TALKCRAFT_AVATAR_MODELS: /models/wav2lip
      HEVI_TALKCRAFT_WHISPER: /models/faster-whisper-large-v3-turbo
      HEVI_NODE_BIN: /usr/bin
      HEVI_TALKCRAFT_THREADS: "2"
      # LivLiv 2.5D avatar engine (engine=livliv / avatar_engine=livliv).
      # Characters are non-commercial use only (see hevi/avatar_livliv/licenses);
      # the player + characters and a Chromium with WebGL2 are mounted read-only.
      LIVLIV_CHARACTERS_ENABLED: "true"
      HEVI_LIVLIV_VENDOR: /livliv
      HEVI_LIVLIV_CHROME: /pwbrowsers/chromium-1248/chrome-linux64/chrome
      HEVI_LIVLIV_TMP: /app/.cache/hevi/livliv
      HEVI_LIVLIV_WORKERS: ${HEVI_LIVLIV_WORKERS:-1}
      HEVI_LIVLIV_BATCH: ${HEVI_LIVLIV_BATCH:-12}
      HEVI_ASSET_ROOT: /app/data/workspace/assets
      HEVI_OUTPUT_ROOT: /app/output
      EXPLAINER_CACHE_DIR: /app/output/explainer_cache
    volumes:
      - /home/soffy/models:/models:ro
      - /home/soffy/.u2net:/u2net:ro
      - ${HEVI_PIPER_VOICES_DIR:-/data/soffy/projects/hevi-zero/voices}:/opt/piper/voices:ro
      - hevi-zero-cache:/app/.cache/hevi/zerolines
      - /home/soffy/Wan2GP:/Wan2GP:ro
      - /home/soffy/projects/hevi/output:/app/output
      - /home/soffy/projects/hevi/data:/app/data
      - /home/soffy/projects/hevi/assets:/app/assets
      - /home/soffy/.nvm/versions/node/v26.4.0:/node26:ro
      - /home/soffy/.cache/hyperframes:/app/.cache/hyperframes:ro
      # LivLiv 2.5D avatar: vendor player+characters (214MB) and a Chromium with
      # WebGL2 (SwiftShader). Both read-only; never baked into the image.
      - /data/soffy/vendor/livliv-player:/livliv:ro
      - /home/soffy/.cache/ms-playwright:/pwbrowsers:ro
      - /home/soffy/.cache/huggingface:/root/.cache/huggingface:ro
      - /data/models/huggingface:/data/models/huggingface:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hevi-redis:
        condition: service_healthy
    command: ["python", "-m", "hevi.queue.worker_entrypoint"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if 'worker_entrypoint' in open('/proc/1/cmdline','rb').read().decode(errors='ignore') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  hevi-render-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.render
      args:
        S16_BUILD_REV: ${S16_BUILD_REV:-dev}
        HEVI_RENDER_BASE_IMAGE: hevi-cftunnel-hevi-api:latest
    image: hevi-cftunnel-hevi-render:latest
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      REDIS_URL: redis://hevi-redis:6379/0
      DATABASE_URL: ${CFTUNNEL_DATABASE_URL:?CFTUNNEL_DATABASE_URL is required for production}
      MINIO_ENDPOINT: ${CFTUNNEL_MINIO_ENDPOINT:-host.docker.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required for production}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required for production}
      MINIO_BUCKET: ${MINIO_BUCKET:-hevi-assets}
      APP_ENV: production
      HEVI_WORKER_RESOURCE_CLASS: drama_render
      HEVI_RENDER_MODE: drama
      HEVI_EXCLUSIVE_RESOURCE_CLASSES: drama_render
      HEVI_LAUNCH_LINES: ${HEVI_LAUNCH_LINES:-collage_broll,koubo_cut,explainer,talking_head,history_scene,cinematic,avatar_spokesperson,kinetic_promo,director_pipeline,handdraw,localization_dub,reference_adapt,character_animation}
      HEVI_OFFLINE_MT_DIR: ${HEVI_OFFLINE_MT_DIR:-/models/argos}
      HEVI_HYPERFRAMES_BIN: ${HEVI_HYPERFRAMES_BIN:-/node26/bin/hyperframes}
      HEVI_PIPER_VOICE: ${HEVI_PIPER_VOICE:-/opt/piper/voices/zh_CN-huayan-medium.onnx}
      HEVI_LAUNCH_STRICT: ${HEVI_LAUNCH_STRICT:-1}
      HEVI_TALKCRAFT_PIPER: /opt/piper/bin/piper
      HEVI_TALKCRAFT_VOICES: /opt/piper/voices
      HEVI_PIPER_BIN: /opt/piper/bin/piper
      HEVI_PIPER_VOICES_DIR: /opt/piper/voices
      HEVI_TALKCRAFT_AVATAR_MODELS: /models/wav2lip
      HEVI_ASSET_ROOT: /app/data/workspace/assets
      HEVI_OUTPUT_ROOT: /app/output
      AI_DRAMA_LIPSYNC: "1"
      AI_DRAMA_BUDGET_CNY: ${AI_DRAMA_BUDGET_CNY:-30}
    volumes:
      - /home/soffy/models:/models:ro
      - /data/soffy/models:/data/soffy/models:ro
      - ${HEVI_PIPER_VOICES_DIR:-/data/soffy/projects/hevi-zero/voices}:/opt/piper/voices:ro
      - /home/soffy/projects/hevi/output:/app/output
      - /home/soffy/projects/hevi/data:/app/data
      - /home/soffy/projects/hevi/assets:/app/assets
      - /home/soffy/.nvm/versions/node/v26.4.0:/node26:ro
      - /home/soffy/.cache/hyperframes:/app/.cache/hyperframes:ro
      - /home/soffy/.cache/huggingface:/root/.cache/huggingface:ro
      - /data/models/huggingface:/data/models/huggingface:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hevi-redis:
        condition: service_healthy
    command: ["python", "-m", "hevi.ai_drama.render_worker_entrypoint"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if 'render_worker_entrypoint' in open('/proc/1/cmdline','rb').read().decode(errors='ignore') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  hevi-scheduler:
    image: hevi-cftunnel-hevi-api:latest
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      REDIS_URL: redis://hevi-redis:6379/0
      DATABASE_URL: ${CFTUNNEL_DATABASE_URL:?CFTUNNEL_DATABASE_URL is required for production}
      MINIO_ENDPOINT: ${CFTUNNEL_MINIO_ENDPOINT:-host.docker.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required for production}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required for production}
      MINIO_BUCKET: ${MINIO_BUCKET:-hevi-assets}
      MNEME_DATABASE_URL: ${MNEME_DATABASE_URL:-}
      MPT_API_BASE: http://host.docker.internal:8080
      MPT_WEBUI_BASE: http://host.docker.internal:8501
      APP_ENV: production
      ADMISSION_TENANT_SCOPES: "wave2-test-ws|wan_local,ltx2_local,qwen_local,local|||render|1.0"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      OMNIROUTE_BASE_URL: http://host.docker.internal:20129/v1
      OMNIROUTE_MODEL: deepseek-v4.1-flash
      HEVI_CANVAS_LLM_CHANNEL: omniroute_free
      HEVI_CANVAS_LLM_TIMEOUT_S: "60"
      HEVI_EXPLAINER_TTS_PROVIDER: piper
      # Daily output retention (scheduler only): intermediates 7d, finals 30d.
      HEVI_OUTPUT_RETENTION_ENABLED: "1"
      HEVI_OUTPUT_ROOT: /app/output
      HEVI_OUTPUT_INTERMEDIATE_DAYS: "7"
      HEVI_OUTPUT_FINAL_DAYS: "30"
      HEVI_OUTPUT_RETENTION_INTERVAL_S: "86400"
      HEVI_OUTPUT_RETENTION_STATE: /app/output/.output-retention-last-run
      HEVI_AUDIO_PROVIDER: piper
      TALKING_FACE_ENGINE: generic
      HEVI_LINE_ENGINE: ${HEVI_LINE_ENGINE:-zero}
      HEVI_LAUNCH_LINES: ${HEVI_LAUNCH_LINES:-collage_broll,koubo_cut,explainer,talking_head,history_scene,cinematic,avatar_spokesperson,kinetic_promo,director_pipeline,handdraw,localization_dub,reference_adapt,character_animation}
      HEVI_OFFLINE_MT_DIR: ${HEVI_OFFLINE_MT_DIR:-/models/argos}
      HEVI_HYPERFRAMES_BIN: ${HEVI_HYPERFRAMES_BIN:-/node26/bin/hyperframes}
      HEVI_PIPER_VOICE: ${HEVI_PIPER_VOICE:-/opt/piper/voices/zh_CN-huayan-medium.onnx}
      HEVI_LAUNCH_STRICT: ${HEVI_LAUNCH_STRICT:-1}
      HEVI_TALKCRAFT_PIPER: /opt/piper/bin/piper
      HEVI_TALKCRAFT_VOICES: /opt/piper/voices
      HEVI_WHISPER_MODEL: /models/faster-whisper-large-v3-turbo
      FASTER_WHISPER_MODEL_DIR: /models/faster-whisper-large-v3-turbo
      # rembg/koubo 素材抠图用宿主已有的 u2net.onnx(176MB),只读挂载,禁止运行期下载 1GB bria
      U2NET_HOME: /u2net
      HEVI_ZERO_CACHE: /app/.cache/hevi/zerolines
      HEVI_TALKCRAFT_REMOTION: /app/hevi-remotion-talkcraft
      HEVI_TALKCRAFT_AVATAR_MODELS: /models/wav2lip
      HEVI_TALKCRAFT_WHISPER: /models/faster-whisper-large-v3-turbo
      HEVI_NODE_BIN: /usr/bin
      HEVI_TALKCRAFT_THREADS: "2"
      # LivLiv 2.5D avatar engine (engine=livliv / avatar_engine=livliv).
      # Characters are non-commercial use only (see hevi/avatar_livliv/licenses);
      # the player + characters and a Chromium with WebGL2 are mounted read-only.
      LIVLIV_CHARACTERS_ENABLED: "true"
      HEVI_LIVLIV_VENDOR: /livliv
      HEVI_LIVLIV_CHROME: /pwbrowsers/chromium-1248/chrome-linux64/chrome
      HEVI_LIVLIV_TMP: /app/.cache/hevi/livliv
      HEVI_LIVLIV_WORKERS: ${HEVI_LIVLIV_WORKERS:-1}
      HEVI_LIVLIV_BATCH: ${HEVI_LIVLIV_BATCH:-12}
      HEVI_ASSET_ROOT: /app/data/workspace/assets
      EXPLAINER_CACHE_DIR: /app/output/explainer_cache
    volumes:
      - /home/soffy/models:/models:ro
      - /home/soffy/.u2net:/u2net:ro
      - /home/soffy/projects/hevi/output:/app/output
      - /home/soffy/projects/hevi/data:/app/data
      - /home/soffy/projects/hevi/assets:/app/assets
      - /home/soffy/.nvm/versions/node/v26.4.0:/node26:ro
      - /home/soffy/.cache/hyperframes:/app/.cache/hyperframes:ro
      # LivLiv 2.5D avatar: vendor player+characters (214MB) and a Chromium with
      # WebGL2 (SwiftShader). Both read-only; never baked into the image.
      - /data/soffy/vendor/livliv-player:/livliv:ro
      - /home/soffy/.cache/ms-playwright:/pwbrowsers:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hevi-redis:
        condition: service_healthy
    command: ["python", "-m", "hevi.scheduler.entrypoint"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if 'scheduler.entrypoint' in open('/proc/1/cmdline','rb').read().decode(errors='ignore') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    name: hevi-cftunnel_default
    external: true

volumes:
  voicebox-data:
  hevi-zero-cache:
  hevi-redis-data:
