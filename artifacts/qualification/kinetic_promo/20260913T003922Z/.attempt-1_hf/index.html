<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <title>HEVI kinetic promo qualification</title>
  <style>
    :root {
    --color-bg: #0B0F1A;
    --color-fg: #F5F5F5;
    --color-accent: #F59E0B;
    --color-primary: #2563EB;
    --color-muted: #6B7280;
    --font-heading: Noto Sans CJK SC;
    --font-body: Noto Sans CJK SC;
    --ease-primary: cubic-bezier(0.65, 0, 0.35, 1);
    --duration-entrance: 0.6s;
    }
    html,body{margin:0;height:100%;background:var(--color-bg);color:var(--color-fg);font-family:var(--font-heading),sans-serif;overflow:hidden}
    .clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8vw;text-align:center}
    h1{font-size:clamp(32px,6vw,84px);letter-spacing:.04em;margin:0}
    p{font-size:clamp(22px,3.4vw,48px);line-height:1.35;margin:0;max-width:20em}
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="4.40" data-width="1920" data-height="1080" data-no-timeline>
    <section class="clip clip-title" data-start="0.00" data-duration="2.40" data-track-index="1"><h1>HEVI kinetic promo qualification</h1></section>
    <section class="clip clip-end" data-start="2.40" data-duration="2.00" data-track-index="2"><p>HEVI kinetic promo qualification</p></section>
  </div>
</body>
</html>
