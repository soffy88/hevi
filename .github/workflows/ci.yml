name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://hevi:hevi@localhost:5432/hevi
      HEVI_TEST_DSN: postgresql://hevi:hevi@localhost:5432/hevi
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hevi
          POSTGRES_PASSWORD: hevi
          POSTGRES_DB: hevi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hevi -d hevi"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH for private deps
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HELIOS_DEPLOY_KEY }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Setup Python 3.14
        run: uv python install 3.14

      - name: Install deps
        run: uv lock --check && uv sync --locked

      - name: Alembic clean PostgreSQL schema
        run: uv run alembic upgrade heads

      - name: V1.0 production closure integration gate
        run: |
          uv run pytest \
            tests/integration/test_constraint_consumption_p0a.py \
            tests/integration/test_artifact_evaluation_p0b.py \
            tests/integration/test_autonomous_repair_p0c.py \
            tests/integration/test_billing_reservation_p0d.py \
            tests/integration/test_execution_plan_p0e.py \
            tests/integration/test_production_closure_e2e.py \
            -vv

      - name: Ruff
        run: uv run ruff check hevi tests

      # 3O 规范 CI 检查(SPEC §6.1):无裸调同级 / 三件套签名 / _enabled_pillars
      - name: 3O compliance checks
        run: |
          uv run python scripts/ci/check_no_sibling_call.py
          uv run python scripts/ci/check_omodul_signature.py
          uv run python scripts/ci/check_enabled_pillars.py
          uv run python scripts/ci/check_runtime_boundaries.py
          uv run python scripts/ci/check_architecture_invariants.py

      # 3O 内化 CI(Phase B/C):配方卡 schema / 判例库编号只增不重排
      - name: Embrace checks (recipe schema + canon numbering)
        run: |
          uv run python scripts/ci/check_recipe_schema.py
          uv run python scripts/ci/check_canon_numbering.py

      - name: Mypy
        run: uv run mypy --strict hevi

      - name: Pytest
        run: uv run pytest tests/ --cov=hevi --cov-report=term --cov-fail-under=80

      # 供应链门禁：High/Critical 依赖漏洞不得无条件进入主干。
      - name: Dependency audit (pip-audit)
        run: uvx pip-audit --strict

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 前端构建门禁 —— 拦住"tsc 过但 next build 崩"(如 @helios/oui 升版删了导出)。
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hevi-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web deps
        run: npm ci --prefer-offline --no-audit
      - name: NPM audit (high/critical)
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests (vitest)
        run: npm run test
      - name: Build
        run: npm run build

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Filesystem vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.8
        with:
          path: .
          format: cyclonedx-json
          artifact-name: hevi-sbom.cdx.json
          output-file: hevi-sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: hevi-sbom
          path: hevi-sbom.cdx.json
