的视觉效果。 风格重点不是把所有内容统一成单一画法，而是保留“精细写实”与“简洁手绘”之间清晰可辨的差异，并让这种差异成为画面的核心风格特征。整体不做厚涂，不做3D，不做强戏剧光影，不做复杂纹样堆砌，不做过强体积塑造，不做商业海报式锐利修饰。","r":"简笔与半写实融合风","x":0},{"id":"FB-035","n":"291","name":"Expressive Ink & Watercolor Storybook","c":"FB","g":"FB 经典绘本叙事 / Picture Book & Watercolor","u":["儿童","绘本","温情","叙事"],"t":"温情绘本叙事；柔和手绘线条、透明水彩、纸张纹理与大面积留白。","r":"","x":1},{"id":"FB-036","n":"292","name":"Minimal Animal Cartoon Storybook","c":"FB","g":"FB 经典绘本叙事 / Picture Book & Watercolor","u":["儿童","绘本","温情","叙事"],"t":"温情绘本叙事；柔和手绘线条、透明水彩、纸张纹理与大面积留白。","r":"","x":1},{"id":"FB-037","n":"293","name":"Warm Daily Life Storybook","c":"FB","g":"FB 经典绘本叙事 / Picture Book & Watercolor","u":["儿童","绘本","温情","叙事"],"t":"温情绘本叙事；柔和手绘线条、透明水彩、纸张纹理与大面积留白。","r":"","x":1},{"id":"FB-038","n":"294","name":"Whimsical Crayon & Watercolor Storybook","c":"FB","g":"FB 经典绘本叙事 / Picture Book & Watercolor","u":["儿童","绘本","温情","叙事"],"t":"温情绘本叙事；柔和手绘线条、透明水彩、纸张纹理与大面积留白。","r":"","x":1},{"id":"FB-039","n":"295","name":"Wild Lush Botanical Storybook","c":"FB","g":"FB 经典绘本叙事 / Picture Book & Watercolor","u":["儿童","绘本","温情","叙事"],"t":"温情绘本叙事；柔和手绘线条、透明水彩、纸张纹理与大面积留白。","r":"","x":1},{"id":"FB-040","n":"296","name":"Cozy Kitchen & Nature Storybook","c":"FB","g":"FB 经典绘本叙事 / Picture Book & Watercolor","u":["儿童","绘本","温情","叙事"],"t":"温情绘本叙事；柔和手绘线条、透明水彩、纸张纹理与大面积留白。","r":"","x":1},{"id":"FB-041","n":"297","name":"Textured Paper Watercolor Storybook","c":"FB","g":"FB 经典绘本叙事 / Picture Book & Watercolor","u":["儿童","绘本","温情","叙事"],"t":"温情绘本叙事；柔和手绘线条、透明水彩、纸张纹理与大面积留白。","r":"","x":1},{"id":"FB-042","n":"298","name":"Luminous Wildlife Watercolor Storybook","c":"FB","g":"FB 经典绘本叙事 / Picture Book & Watercolor","u":["儿童","绘本","温情","叙事"],"t":"温情绘本叙事；柔和手绘线条、透明水彩、纸张纹理与大面积留白。","r":"","x":1},{"id":"FB-043","n":"299","name":"Bold Acrylic Cinematic Storybook","c":"FB","g":"FB 经典绘本叙事 / Picture Book & Watercolor","u":["儿童","绘本","温情","叙事"],"t":"温情绘本叙事；柔和手绘线条、透明水彩、纸张纹理与大面积留白。","r":"","x":1},{"id":"FB-044","n":"300","name":"Expressive Border Charcoal & Watercolo g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"以电影核心概念为先，而非固定画法；擅长“减法”、视觉隐喻与大尺度留白，常借鉴水墨、书法、传统图形与东方空间意识；摄影、插画、字体、图形会随项目变化。","r":"","x":1},{"id":"FE-040","n":"209","name":"Digital Chinese Gongbi Fantasy","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"用数位板和数字笔刷模拟中国画皴、擦、点、染；重视白描、工笔人物、衣纹和结构；题材常取古典文学、志怪、神话与历史，具有严谨线描和数字水墨结合的特征。","r":"","x":1},{"id":"FE-041","n":"210","name":"Contemporary Chinese Ink Picturebook","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"中国水墨的线条与墨色为核心，但叙事结构现代；造型简练、灵动、略带拙趣与怪趣；把传统神祇、民俗和东方哲学转换成儿童可以进入的日常童话。","r":"","x":1},{"id":"FE-042","n":"211","name":"Wild Chinese Ink Fantasy Comic","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"铅笔、毛笔、墨水、水彩与有质感纸张并用；墨线狂放、干湿与飞白明显，静态细节与强烈动作并存；常见少年侠客、山林、妖怪与志怪幻想，气质野、孤独而自由。","r":"","x":1},{"id":"FE-043","n":"212","name":"Hong Kong Urban Female Comic Illustration","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"强烈的女性主体意识与身体表现；人物自信、性感但不以媚态为核心；水彩、漫画线条、时装与香港都市经验交织，构图自由且有当代独立漫画气质。","r":"","x":1},{"id":"FE-044","n":"213","name":"Gentle Seasonal Nature Illustration","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"长期围绕四季、自然、旅行和日常生活；人物常缩小在更大的环境中，强调人与自然的关系；色彩柔和明亮、笔触松弛，画面带梦境感、季节光线和安静的孤独感。","r":"","x":1},{"id":"FE-045","n":"214","name":"Warm Nostalgic Everyday Picturebook","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"作者自述关键词为“温暖、感动、记录”；常以80后成长记忆、家庭、友情与生活阶段为内容；画面偏日记和绘本叙事，柔和温暖，偶尔进入荒诞或黑白想象。","r":"","x":1},{"id":"FE-046","n":"215","name":"Realistic Absurdist Webcomic","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"基础造型相对写实，人物面部和肢体却高度表演化；夸张表情、无厘头台词、鬼畜式节奏和电影分镜制造喜剧反差；作者常自拍表情作为绘画参考。","r":"","x":1},{"id":"FE-047","n":"216","name":"Beijing Hutong Watercolor Graphic Novel","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"全水彩手绘、明快色彩、轻松线条与流畅分镜；擅长老北京胡同、街坊日常与儿童视角，把现实生活和轻度奇幻自然融合，空间细节丰富但整体温暖轻盈。","r":"","x":1},{"id":"FE-048","n":"188","name":"Chinese Retro Lianhuanhua","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"黑色细线、旧纸、有限色、传统叙事。","r":"中式复古连环画","x":0},{"id":"FE-049","n":"189","name":"New-Guochao Flat Gongbi","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"工笔结构 + 平面色块 + 金色/传统纹样。","r":"新国潮工笔扁平","x":0},{"id":"FE-050","n":"190","name":"Modern Dunhuang Illustration","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"飞天曲线、矿物色、莲花云纹、壁画颗粒。","r":"敦煌新插画","x":0},{"id":"FE-051","n":"191","name":"Modernized Song-Dynasty Light Color","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"米白留白、细线、青绿赭石、古典安静。","r":"宋画淡彩现代化","x":0},{"id":"FE-052","n":"192","name":"New-Chinese Tiny Ink Figures","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"大留白、水墨晕染、小人物、东方情绪。","r":"新中式水墨小人","x":0},{"id":"FE-053","n":"193","name":"Cantonese Dim-Sum Guochao","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"岭南元素、点心、暖橙青绿、生活国潮。","r":"广式早茶国潮","x":0},{"id":"FE-054","n":"194","name":"Shanghai Calendar-Poster Retro","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"20–30 年代上海商业画、女性、复古广告色。","r":"海派月份牌 Retro","x":0},{"id":"FE-055","n":"195","name":"Republic-Era Advertising Redesign","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"旧商业人物、平涂、复古字体结构、现代化简化。","r":"民国广告画再设计","x":0},{"id":"FE-056","n":"240","name":"Pale Lacquer & Raden Decorative Illustration","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"**当代新中式浅色漆画式二维装饰插画，融合中国古典人物画的造型语言与现代平面设计。整体首先呈现为平面装饰画，而非传统工笔写实绘画。造型高度概括，轮廓完整流畅，人物比例与形态根据主题自适应，但始终保持简化、纤细、含蓄；面部几乎不塑造真实体积，五官简洁、符号化、留白化，肤色均匀平整。** **以清晰轮廓、大面积平涂色块和极少量柔和过渡塑造形体，内部细节明显删减并图案化；弱明暗、弱透视、弱空间纵深，不表现真实光源，不使用空气透视和写实景深。** **整体采用高明度、浅暖色基调，但避免颜色过度灰化、粉化和褪色。画面约 65%–80% 保持象牙白、米白、浅杏、暖灰、浅玉色等明亮区域；朱砂、石青、石绿、灰蓝、浅赭等传统矿物色作为有限的中等面积色块使用。整体饱和度在原有浅雅基础上轻微提升约 10%–15%，使朱砂更鲜润、石青更清透、石绿更明确，但仍保持柔和克制，不进入高饱和、浓艳或艳俗状态。** **色彩关系强调“浅底 + 少量较纯色块”的对比：大面积背景和肤色继续保持低饱和、高明度，服饰边缘、器物、花叶、局部装饰可以使用稍纯一些的朱砂红、石青蓝、石绿色形成视觉节奏。避免整幅画平均增艳，也避免所有颜色同时提高饱和度。** **深色只承担少量轮廓、结构与视觉锚点，禁止形成大面积黑色或深褐色块，避免黑漆底、暗金底和厚重宫廷色调。深色面积应明显少于浅色和中性色，整体仍保持通透、明亮、柔和。** **表面保留中国传统漆艺的温润、细腻和微微矿物质感，但以浅色漆面、哑光漆面和柔和矿物颜料质感为主。色彩表面可以具有轻微矿物颜料的颗粒感、天然色差和温润厚度，但不追求厚重黑漆、金箔堆积、高反射或珠宝般光泽。** **螺钿与贝母仅作为极少量的“装饰性镶嵌层”使用，而不是全局材质。虹彩区域控制在画面约 3%–8%，只出现在具有明确装饰属性的局部纹样、边缘、点缀区域或次要表面中；不得随机覆盖主要造型，不改变主体原本的材质属性。** **螺钿效果应呈现为薄片状、细碎、局部、克制的贝母色偏，可出现极轻微的青绿、粉紫、淡蓝虹彩，但综合色彩必须服从整体矿物色体系，而不是形成大片闪光、水晶化、金属化或珠宝化效果。** **尤其保持主体核心形态、皮肤、面部、主要大色块和大面积背景的材质纯净，不被螺钿纹理侵入。虹彩只作为视觉点睛，而不是画面主要质感。** **画面强调装饰性构成，通过平面叠压、轮廓遮挡、局部越界和形状穿插建立层次；空间更接近漆画、壁画、屏风画与现代装饰画的组织逻辑，而不是现实场景透视。** **整体气质明亮、温润、静谧、古雅、精致、轻盈、含蓄。相比传统低饱和新中式插画，色彩稍微更鲜活、更清澈、更有矿物颜料的纯净感，但仍然保持高级、克制和东方审美，不做浓艳国潮，不做鲜艳商业插画。** **避免：大面积黑色、黑漆底、暗金色调、厚重宫廷感、全局螺钿化、随机虹彩覆盖、大块贝壳拼贴、水晶化、珠宝化、过度灰粉、过度奶油色、全画面褪色、低对比到发白、浓艳国潮、高饱和撞色、荧光色、写实工笔、真实人体塑造、现代古风 CG、摄影感、电影光影、真实三维空间、写实山水透视、复杂衣纹、精细刺绣、高密度环境细节、仙侠氛围。**","r":"素漆螺钿插画风","x":0},{"id":"FE-057","n":"242","name":"Contemporary Peking Opera Comic Illustration","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"当代手绘戏曲漫画插画风，借用中国京剧人物画谱、京剧脸谱和老派中国戏曲漫画的造型语言，并以现代插画审美重新简化和整理。古代人物：保留明显的戏曲角色特征。一张图中如果有多个角色，每个人都要有不同眉眼结构，让角色之间通过眼形、眉形、脸型和妆容直接形成区分；避免所有人物共用同一张“京剧脸”。现代人物：不要用脸谱和头饰，但是可以有戏曲式化妆，除了女主角，其他人都不要吊眼角。所有人物比例整体偏短、偏宽、偏压缩，约2.5～3头身，头部相对较大、躯干较短、腿短、手脚小；即使人物处于坐姿、奔跑、打斗或其他动作中，也不要恢复正常写实人体比例，而要始终保持紧凑、团块化、略带笨拙的戏曲漫画体态。人物、动物、器物和环境都可根据性格与剧情进行概括、压缩、夸张和变形，造型紧凑、歪斜、略带拙趣。使用松弛清晰的黑色手绘墨线，搭配经过现代插画化提亮的朱红、翠绿、湖蓝、鹅黄、粉紫、青绿等中高明度东方色彩，以大色块和平涂为主，整体明快、轻盈、干净，不做灰暗复古和仿古做旧。画面强调大轮廓、低细节密度和大量负空间，人物高度概括，场景不必完整展开，只保留最能说明情境的局部元素和少量环境线索，避免复杂建筑、密集军阵、繁复纹样和满画面铺陈。整体既有京剧脸谱和老派戏曲漫画的怪趣、程式感与角色性，又具有当代插画的简洁、鲜亮、轻松和设计感。人物高度概括，背景简洁，保留大量负空间。","r":"当代戏曲漫画插画风","x":0},{"id":"FE-058","n":"256","name":"Feng Zikai Literati Brushwork & Whimsical Ink Sketch","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"丰子恺文人漫画风格、大面积宣纸意境留白、朴实幽默与生活哲思趣意、简练写意的传统毛笔水墨勾勒、高度概括生动的人形动态、温润清雅的传统国画设色。","r":"丰子恺","x":0},{"id":"FE-059","n":"257","name":"Airy Chinese Ink Fantasy Animation","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"参考作品：中国奇谭《鹅鹅鹅》的画风。仅参考其整体视觉语言、线条、笔触、水墨质感、设色方式、人物造型语言、东方幻想气质与手绘动画感，不直接复制或延续原作中的角色、服装、道具、场景、构图、剧情和具体视觉元素；如果主题没有明确指定，默认不要引入任何原作角色或标志性元素。 保留其古朴、诡谲、含蓄、荒诞的东方水墨动画气质，但整体画面不要过暗。减少大面积黑灰和重墨压暗，避免低曝光、强暗角和大片深色阴影；提高整体明度与空气感，多使用浅墨、淡彩、米白、灰青、浅赭等高明度低饱和色彩，让纸张底色、雾气和留白参与画面。画面可以神秘、诡异，但不要靠“压黑”制造氛围，整体保持清透、柔和、层次分明。","r":"中国奇谭·鹅鹅鹅","x":0},{"id":"FE-060","n":"267","name":"Minimal Ink Cartoon Style","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"白底中国式极简手绘漫画；黑色毛笔/软头笔快速勾画；线条松散粗粝、粗细变化明显、略带断笔与手绘抖动；人物高度概括、比例略夸张、造型笨拙有趣；场景只保留最必要的物件与动作；大面积留白；黑色线稿为主体；脸颊、衣服或小道具加入少量红黄绿局部平涂；中国写意人物画与老式讽刺漫画的味道","r":"","x":1},{"id":"FE-061","n":"268","name":"Contemporary Literati Ink Cartoon","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"现代生活人物、动物和日常小场景；白色或微暖纸面、大面积留白；毛笔和墨线快速画人物；线条松弛、粗细不一、枯湿自然、允许断笔和不闭合轮廓；人物高度概括、比例略笨拙，以姿态和动作表达情绪；人物是画面的主要视觉主体；场景保留少量必要元素；墨色为主，少量朱红、赭石、石绿、湖蓝局部点染；书法题字和朱红印章自然嵌入留白；整体拙朴、松弛、幽默、闲适；现代生活速写与中国写意笔墨结合","r":"当代人文水墨漫画","x":0},{"id":"FE-062","n":"269","name":"Socialist Realist Propaganda Poster","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"","r":"社会主义现实主义宣传画","x":0},{"id":"FE-063","n":"270","name":"Chinese Farmers Painting","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"错透视、鲜艳平涂、大量留白。","r":"中国农民画","x":0},{"id":"FE-064","n":"271","name":"1980s-1990s Chinese Textbook Illustration","c":"FE","g":"FE 新国风与传统工艺 / Chinese Traditional & Folk Craft","u":["国风","历史","文化","节庆"],"t":"","r":"八九十年代中国课本插图风"," 高饱和电影感美漫插画 / Cinematic American Comic Illustration","x":0},{"id":"FG-020","n":"326","name":"Retro Seinen Manga Line Art, American Narrative Illustration, Digital Cel Shading","c":"FG","g":"FG 动漫和赛璐璐 / Anime, Cel Animation & Retro Game","u":["动画","短剧","二次元"],"t":"复古漫画、半写实人物、日式青年漫画线稿、美式叙事插画、暖色低饱和、手绘墨线、复古纸张纹理、夸张表情、动态速度线、数字赛璐璐上色。","r":"复古青年漫画与美式叙事插画 / Retro Seinen Manga & American Narrative Illustration","x":0},{"id":"FG-021","n":"327","name":"Korean Webtoon","c":"FG","g":"FG 动漫和赛璐璐 / Anime, Cel Animation & Retro Game","u":["动画","短剧","二次元"],"t":"","r":"韩漫webtoon / Korean Webtoon","x":0},{"id":"FG-022","n":"329","name":"Spider-Man: Into the Spider-Verse Animation Style","c":"FG","g":"FG 动漫和赛璐璐 / Anime, Cel Animation & Retro Game","u":["动画","短剧","二次元"],"t":"","r":"动画片《蜘蛛侠：平行宇宙》 / Spider-Man: Into the Spider-Verse","x":0},{"id":"FG-023","n":"330","name":"Retro 90s Cel Anime & Korean Emotional Webtoon Illustration, Grainy Nostalgic Film Aesthetic","c":"FG","g":"FG 动漫和赛璐璐 / Anime, Cel Animation & Retro Game","u":["动画","短剧","二次元"],"t":"复古日系二维动画与现代韩系情绪漫画融合的插画风格，具有1990年代手绘赛璐璐动画的朴素视觉质感。二维平面绘制，清晰但略带自然手绘感的深色轮廓线，线条轻微不规则，轮廓简洁，细节适度省略。大面积平涂色块，硬边赛璐璐阴影，明暗层次简化，阴影以完整、清晰的形状呈现，几乎没有柔和渐变或复杂体积塑造。整体配色低饱和、暗调、褪色感，偏砖红、暗青绿、灰蓝、灰褐、褪色粉橙与米灰色，色彩之间具有克制的冷暖对比，暗部厚重，黑色深沉。背景采用概括性的色块、简化的形体与有限的细节，呈现二维动画背景美术的平面感，不刻意追求写实精度。全画面覆盖明显、均匀、细密的模拟胶片噪点，颗粒与画面色彩自然融合，轻微色彩漂移、柔和的旧胶片褪色感，带有细微的模拟影像粗糙度。画面具有克制的光影、略低的清晰度、自然的暗部色彩沉积，整体像经过模拟胶片扫描和统一调色处理的旧动画截图。视觉语言安静、内敛、忧郁、怀旧，带有轻微的梦境感和疏离感，质朴而不精致化，强调二维手绘痕迹、色彩氛围和年代质感。","r":"复古日系赛璐璐与韩系情绪动画 / Retro 90s Cel Anime & Korean Mood Webtoon","x":0},{"id":"FG-024","n":"367","name":"Your Name Anime","c":"FG","g":"FG 动漫和赛璐璐 / Anime, Cel Animation & Retro Game","u":["动画","短剧","二次元"],"t":"动画赛璐璐；干净线稿、平涂色块、鲜明角色设计。","r":"《你的名字。》 / Your Name","x":1},{"id":"FG-025","n":"368","name":"Perler Bead Pixel Art","c":"FG","g":"FG 动漫和赛璐璐 / Anime, Cel Animation & Retro Game","u":["动画","短剧","二次元"],"t":"规则排列的圆形拼豆珠孔网格、像素对齐结构、手工塑料熔珠轻微颗粒肌理与受热微熔接痕迹、鲜明纯正的平涂色彩、清晰硬朗的阶梯状像素边缘","r":"拼豆像素画","x":0},{"id":"FH-001","n":"155","name":"
