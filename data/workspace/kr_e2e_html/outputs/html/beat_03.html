<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:linear-gradient(160deg,#e8ecf1,#cbd5e0);font-family:'Noto Sans SC','PingFang SC',sans-serif;}
  .stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3vh;padding:6vh 6vw;box-sizing:border-box;}
  @keyframes cam { from { transform: scale(1.02); } to { transform: scale(1.0); } }
  .cam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3vh;animation:cam 5.0s ease-in-out both;}
  .line{color:#2d3748;font-weight:800;line-height:1.35;font-size: clamp(56px, 11vw, 112px); text-align: center;
    text-shadow:0 2px 10px rgba(255,255,255,.5);}
  .emoji{font-size:clamp(64px,12vw,140px);filter:drop-shadow(0 6px 14px rgba(0,0,0,.25));}
  .light{position:absolute;inset:0;pointer-events:none;}
  .foot{position:absolute;bottom:6vh;width:100%;text-align:center;
    color:rgba(45,55,72,.55);font-size:clamp(20px,4vw,34px);font-weight:600;}
</style></head><body>
<div class="stage">
  <div class="cam">
    <div class="emoji">✨</div>
    
    <div class="foot"> · </div>
  </div>
  <div class="light"></div>
</div>
<audio id="nar" src="data:audio/mpeg;base64," autoplay></audio>
<script>var a=document.getElementById('nar');a.addEventListener('ended',function(){window.__heviAudioEnded=true;});setTimeout(function(){window.__heviAudioEnded=true;},5000);</script>
</body></html>
