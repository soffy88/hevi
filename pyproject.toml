[project]
name = "hevi"
version = "6.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "mcp>=1.28.1,<2.0",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",
    # 3O 基线：所有直接引用固定到通过消费者契约测试的精确提交；版本/锁文件/manifests
    # 必须同时更新。HEVI 保留业务语义，通用执行与媒体能力在对应 3O 库演进。
    "obase[cache,docker] @ git+https://github.com/helios-plat/obase.git@62f9df0",
    "oprim @ git+https://github.com/helios-plat/oprim.git@7c0b237",
    "oskill @ git+https://github.com/helios-plat/oskill.git@184362c",
    # 标准长视频及镜头返工事务：兼容 v1.36.0 的已测提交，待上游 tag 后替换 ref。
    "omodul @ git+https://github.com/helios-plat/omodul.git@8d7d0c1",
    # 统一的无状态服务执行骨架。固定到已测试的 3O 功能提交；合入上游 tag 后只替换 ref。
    "oservi @ git+https://github.com/helios-plat/oservi.git@ad30a98",
    "python-frontmatter>=1.3.0",  # oprim v3.10 transitive dep (not declared in oprim)
    "vibevoice==0.0.1",  # oprim._vibevoice_synthesize runtime dep (not declared in oprim metadata)
    "dashscope>=1.20",  # oprim v3.10.33 embedding.qwen3_dashscope runtime dep (undeclared)
    "edge-tts>=7.0",  # hevi.explainer.voiceover —— 短视频解说通道配音(词级时间戳)
    "prometheus-client>=0.25.0",
    "psycopg2-binary>=2.9.12",
    "minio>=7.2.20",
    "torch>=2.12.0",
    "transformers==5.5.0",
    "diffusers>=0.30",
    "accelerate>=1.6.0",
    "faster-whisper>=1.2.1",
    "edge-tts>=7.2.8",
    "av>=12",  # 3O §C4: PyAV 解码抽帧(自带 ffmpeg 库,不依赖系统 ffmpeg 二进制)
    "sqlmodel>=0.0.39",  # v9.1: 任务大盘 SQLite ORM (TaskRun 状态机)
    "pillow>=10",  # v9.1: 素材质检(尺寸/像素总量/EXIF 方向)前端拦截的后端兜底
    "playwright>=1.49",  # v9.1 Lite 管道:无头浏览器录屏(hevi.pipeline_lite.oprim.oprim_playwright)
]

[project.optional-dependencies]
# 社区版 ManimCE(Cairo 无头)。系统还需 ffmpeg + libcairo2 + libpango1.0。
# 3b1b 原版是另一个包: pip install manimgl
manim = ["manim>=0.18"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
    "hevi/db/alembic/",
    "services/gen_engine/vibeasr-src/",
    # vendored 上游代码(voice-pro 重供 CosyVoice + Matcha-TTS), 不做本地 lint
    "services/gen_engine/cosyvoice/",
    "services/gen_engine/third_party/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PERF", "PIE", "RUF"]
# RUF001/002/003 = 歧义 unicode 字符:本项目大量中文注释/文案,全是误报,禁用。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# 测试惯用法:嵌套 with patch(...)、async-for-append、pytest.raises 正则 —— 放宽。
"tests/**" = ["C408", "E501", "E741", "SIM117", "SIM102", "PERF401", "RUF043"]
# freevideo 模板内嵌 CSS f-string,长行是常态。
"hevi/assembly/freevideo/*.py" = ["E501"]
# LLM prompt 模板 / HTML-CSS 动画模板 / SQL / 长文案 f-string:内容行(非代码行)天然超长,
# 换行会破坏模板可读性与语义;与 freevideo 先例一致只豁免 E501,其余规则照常。
"hevi/pipeline_lite/oprim/oprim_visual_scenes.py" = ["E501"]
"hevi/pipeline_lite/oprim/oprim_html_gen.py" = ["E501"]
"hevi/storygraph/extract.py" = ["E501"]
"hevi/tongjian/chapter_ir.py" = ["E501"]
"hevi/tongjian/shotlist.py" = ["E501"]
"hevi/tongjian/character_bible.py" = ["E501"]
"hevi/vault/identity_pack.py" = ["E501"]
"hevi/vault/service.py" = ["E501"]
"hevi/cinematic/animation_html.py" = ["E501"]
"hevi/cinematic/golden_formula.py" = ["E501"]
"hevi/cinematic/scene_adapt.py" = ["E501"]
"hevi/director/screenplay.py" = ["E501"]
"hevi/video/wavespeed_service.py" = ["E501"]
"hevi/video/alibaba_maas_service.py" = ["E501"]
"hevi/resilience/fallback_chain.py" = ["E501"]
"hevi/image/sdxl_local_service.py" = ["E501"]
"hevi/dub/_synth.py" = ["E501"]
"hevi/director/agent.py" = ["E501"]
"hevi/creative/__init__.py" = ["E501"]
"hevi/canvas/node_mapper.py" = ["E501"]
"hevi/audio/funasr_verify.py" = ["E501"]
"hevi/audio/audio_router.py" = ["E501"]
# 3O adapter packages intentionally re-export large public contracts from
# their oprim/oskill/omodul boundary modules.  These are API surfaces rather
# than ordinary implementation modules; keep semantic lint (undefined names,
# duplicate keys, etc.) active while allowing export-only import ordering and
# documentation line length.
"hevi/*/omodul/__init__.py" = ["E501", "F401", "RET504", "RUF022"]
"hevi/*/oskill/__init__.py" = ["E501", "F401", "F811", "PERF401", "RET504", "RUF022"]
"hevi/*/oprim/__init__.py" = ["E501", "B904", "F401", "F811", "F841", "PERF401", "RET504", "RUF022"]
"hevi/*/schemas.py" = ["E501", "UP042"]
"hevi/*/__init__.py" = ["E501", "F401", "F811", "RUF022"]

[tool.mypy]
strict = true
python_version = "3.14"
exclude = ["hevi/db/alembic/", "services/gen_engine/cosyvoice/", "services/gen_engine/third_party/"]

[[tool.mypy.overrides]]
module = ["vibevoice", "vibevoice.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

# Optional provider SDKs are imported lazily at the adapter edge.  Their
# runtime availability is tested by provider capability probes; they do not
# ship usable typing metadata for the strict application check.
[[tool.mypy.overrides]]
module = ["yaml", "deepl", "deep_translator", "openai", "faster_whisper", "loguru"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

# gen_engine 子进程 worker: 运行在容器内独立 venv(torch 版本/依赖集与 dev 环境不同),
# 严格类型检查是噪音; 由容器内 smoke 测试与 hevi-api 客户端测试兜底。
[[tool.mypy.overrides]]
module = ["gen_engine.f5_worker", "gen_engine.cosy_worker"]
ignore_errors = true
ignore_missing_imports = true

# 未提供 stubs/py.typed 的第三方运行依赖:asyncpg(直连 mneme 库)/dashscope(阿里百炼)/
# cv2(素材质检)/oservi(3O 无状态执行骨架) —— 统一按未类型化模块处理。
[[tool.mypy.overrides]]
module = ["asyncpg", "dashscope", "cv2", "oservi", "oservi.*"]
ignore_missing_imports = true

# oprim 已 py.typed,但其原子函数(probe_duration/edge_tts_word_boundary 等)未标注参数类型,
# 在严格上下文中调用会被 no-untyped-call 拦住;原子边界属第三方,放行调用(返回值仍参与检查)。
[[tool.mypy.overrides]]
module = ["oprim"]
disable_error_code = ["no-untyped-call"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 只收集单元测试目录;scripts/integration/*.py 是需 GPU/服务的手动集成脚本,
# 不应被 `pytest`(根目录)误收集导致 collection 报错(见 CI 与本地一致性)。
testpaths = ["tests"]
# Provider-specific packages currently publish incompatible upper/lower
# bounds. Keep secure versions in the root runtime while Voicebox/Gen Engine
# inference environments remain independently pinned.
[tool.uv]
override-dependencies = ["transformers==5.5.0", "pillow>=12.3.0"]


[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
