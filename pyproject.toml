[project]
name = "hevi"
version = "6.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",
    # 3O 基线：所有直接引用固定到通过消费者契约测试的精确提交；版本/锁文件/manifests
    # 必须同时更新。HEVI 保留业务语义，通用执行与媒体能力在对应 3O 库演进。
    "obase[cache,docker] @ git+ssh://git@github.com/helios-plat/obase.git@62f9df0",
    "oprim @ git+ssh://git@github.com/helios-plat/oprim.git@7c0b237",
    "oskill @ git+ssh://git@github.com/helios-plat/oskill.git@184362c",
    # 标准长视频及镜头返工事务：兼容 v1.36.0 的已测提交，待上游 tag 后替换 ref。
    "omodul @ git+ssh://git@github.com/helios-plat/omodul.git@8d7d0c1",
    # 统一的无状态服务执行骨架。固定到已测试的 3O 功能提交；合入上游 tag 后只替换 ref。
    "oservi @ git+ssh://git@github.com/helios-plat/oservi.git@ad30a98",
    "python-frontmatter>=1.3.0",  # oprim v3.10 transitive dep (not declared in oprim)
    "vibevoice==0.0.1",  # oprim._vibevoice_synthesize runtime dep (not declared in oprim metadata)
    "dashscope>=1.20",  # oprim v3.10.33 embedding.qwen3_dashscope runtime dep (undeclared)
    "edge-tts>=7.0",  # hevi.explainer.voiceover —— 短视频解说通道配音(词级时间戳)
    "prometheus-client>=0.25.0",
    "psycopg2-binary>=2.9.12",
    "minio>=7.2.20",
    "torch>=2.12.0",
    "transformers==4.51.3",
    "diffusers>=0.30",
    "accelerate>=1.6.0",
    "faster-whisper>=1.2.1",
    "edge-tts>=7.2.8",
    "av>=12",  # 3O §C4: PyAV 解码抽帧(自带 ffmpeg 库,不依赖系统 ffmpeg 二进制)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["hevi/db/alembic/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PERF", "PIE", "RUF"]
# RUF001/002/003 = 歧义 unicode 字符:本项目大量中文注释/文案,全是误报,禁用。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# 测试惯用法:嵌套 with patch(...)、async-for-append、pytest.raises 正则 —— 放宽。
"tests/**" = ["SIM117", "SIM102", "PERF401", "RUF043"]

[tool.mypy]
strict = true
python_version = "3.14"
exclude = ["hevi/db/alembic/"]

[[tool.mypy.overrides]]
module = ["vibevoice", "vibevoice.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 只收集单元测试目录;scripts/integration/*.py 是需 GPU/服务的手动集成脚本,
# 不应被 `pytest`(根目录)误收集导致 collection 报错(见 CI 与本地一致性)。
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
