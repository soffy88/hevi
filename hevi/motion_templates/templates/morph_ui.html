<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Hevi Motion Template - Morph UI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script src="../lib/spring.js"></script>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
  (function () {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // ------------------------------------------------------------------
    // Test instrumentation: record every fillText bounding box (canvas
    // space) only when explicitly enabled. Does not alter draw(t) output.
    // ------------------------------------------------------------------
    let __recordText = false;
    window.__textBoxes = [];
    window.__containers = [];
    window.setRecordText = function (v) { __recordText = !!v; };

    function _applyTransform(c, x, y) {
      const m = c.getTransform();
      return { x: m.a * x + m.c * y + m.e, y: m.b * x + m.d * y + m.f };
    }

    function ft(c, text, x, y, maxW) {
      const str = String(text == null ? "" : text);
      if (__recordText && str.trim().length > 0) {
        const m = c.measureText(str);
        const left = x - m.actualBoundingBoxLeft;
        const right = x + m.actualBoundingBoxRight;
        const top = y - m.actualBoundingBoxAscent;
        const bottom = y + m.actualBoundingBoxDescent;
        const p0 = _applyTransform(c, left, top);
        const p1 = _applyTransform(c, right, bottom);
        const bx = Math.min(p0.x, p1.x), by = Math.min(p0.y, p1.y);
        const bw = Math.abs(p1.x - p0.x), bh = Math.abs(p1.y - p0.y);
        let container = null;
        const ccx = bx + bw / 2, ccy = by + bh / 2;
        for (const r of (window.__containers || [])) {
          if (ccx >= r.x && ccx <= r.x + r.w && ccy >= r.y && ccy <= r.y + r.h) { container = r; break; }
        }
        window.__textBoxes.push({ x: bx, y: by, w: bw, h: bh, text: str, alpha: c.globalAlpha, container: container });
      }
      if (maxW !== undefined) c.fillText(str, x, y, maxW);
      else c.fillText(str, x, y);
    }

    let spec = {
      title: "智能视频生成流水线",
      bpm: 120,
      duration: 12.0,
      states: [
        {
          id: "start_btn",
          type: "button",
          title: "启动智能成片引擎",
          badge: "INITIALIZE",
          accent: "#f59e0b",
          duration_beats: 4
        },
        {
          id: "parse_progress",
          type: "progress",
          title: "脚本解析与分镜语义分解",
          badge: "ANALYZING 88%",
          progress: 0.88,
          accent: "#10b981",
          duration_beats: 4
        },
        {
          id: "metric_stats",
          type: "metric",
          title: "原子镜头规划就绪",
          badge: "SHOTS: 18 / 18",
          value: "18",
          unit: "CLIPS",
          accent: "#38bdf8",
          duration_beats: 4
        },
        {
          id: "perf_chart",
          type: "chart",
          title: "算力调度与渲染吞吐",
          badge: "THROUGHPUT",
          bars: [0.45, 0.72, 0.95, 0.84, 0.62],
          accent: "#f59e0b",
          duration_beats: 4
        },
        {
          id: "preview_player",
          type: "player",
          title: "4K 确定性画质实时预览",
          badge: "PREVIEW 60FPS",
          playhead: 0.65,
          accent: "#e11d48",
          duration_beats: 4
        },
        {
          id: "gate_check",
          type: "card",
          title: "质量门禁与黑场审片通过",
          badge: "QUALITY VERIFIED",
          detail: "film_gate: 0 errors | 0 dropouts",
          accent: "#10b981",
          duration_beats: 4
        }
      ]
    };

    let width = 1080;
    let height = 1920;
    let fScale = 1.0;
    let stateSchedule = [];
    let totalDuration = 12.0;

    function buildSchedule() {
      const beatDur = 60.0 / (spec.bpm || 120);
      let curT = 0.5;
      stateSchedule = [];

      for (let i = 0; i < spec.states.length; i++) {
        const s = spec.states[i];
        const dur = (s.duration_beats || 4) * beatDur;
        stateSchedule.push({
          index: i,
          state: s,
          tStart: curT,
          tEnd: curT + dur,
          dur: dur
        });
        curT += dur;
      }
      totalDuration = Math.max(spec.duration || 12.0, curT + 0.5);
    }

    window.initTemplate = function (newSpec, w, h) {
      if (newSpec) spec = Object.assign({}, spec, newSpec);
      width = w || 1080;
      height = h || 1920;
      canvas.width = width;
      canvas.height = height;
      fScale = Math.min(width, height) / 1080;
      buildSchedule();
    };

    function getStateGeometry(state, idx, w, h) {
      const cx = w / 2;
      const cy = h / 2;
      const isLandscape = w > h;

      switch (state.type) {
        case "button":
          return {
            x: cx - 260 * fScale,
            y: cy - 48 * fScale,
            w: 520 * fScale,
            h: 96 * fScale,
            radius: 48 * fScale,
            bg: "#1e293b",
            border: state.accent || "#f59e0b",
            borderWidth: 2 * fScale
          };
        case "progress":
          return {
            x: cx - (isLandscape ? 440 : 400) * fScale,
            y: cy - 70 * fScale,
            w: (isLandscape ? 880 : 800) * fScale,
            h: 140 * fScale,
            radius: 28 * fScale,
            bg: "#182234",
            border: "#334155",
            borderWidth: 2 * fScale
          };
        case "metric":
          return {
            x: cx - 290 * fScale,
            y: cy - 170 * fScale,
            w: 580 * fScale,
            h: 340 * fScale,
            radius: 32 * fScale,
            bg: "#162032",
            border: state.accent || "#38bdf8",
            borderWidth: 2 * fScale
          };
        case "chart":
          return {
            x: cx - (isLandscape ? 440 : 410) * fScale,
            y: cy - 240 * fScale,
            w: (isLandscape ? 880 : 820) * fScale,
            h: 480 * fScale,
            radius: 32 * fScale,
            bg: "#141e30",
            border: "#334155",
            borderWidth: 2 * fScale
          };
        case "player":
          return {
            x: cx - (isLandscape ? 450 : 420) * fScale,
            y: cy - 250 * fScale,
            w: (isLandscape ? 900 : 840) * fScale,
            h: 500 * fScale,
            radius: 28 * fScale,
            bg: "#111827",
            border: state.accent || "#e11d48",
            borderWidth: 2 * fScale
          };
        case "card":
        default:
          return {
            x: cx - 400 * fScale,
            y: cy - 190 * fScale,
            w: 800 * fScale,
            h: 380 * fScale,
            radius: 32 * fScale,
            bg: "#132137",
            border: state.accent || "#10b981",
            borderWidth: 2.5 * fScale
          };
      }
    }

    function computeContainerAtTime(t, w, h) {
      if (stateSchedule.length === 0) buildSchedule();

      let prevIdx = 0;
      let nextIdx = 0;

      for (let i = 0; i < stateSchedule.length; i++) {
        if (t >= stateSchedule[i].tStart) {
          prevIdx = i;
          nextIdx = Math.min(i + 1, stateSchedule.length - 1);
        }
      }

      const curSched = stateSchedule[prevIdx];
      const nextSched = stateSchedule[nextIdx];

      const gCur = getStateGeometry(curSched.state, prevIdx, w, h);
      const gNext = getStateGeometry(nextSched.state, nextIdx, w, h);

      if (prevIdx < nextIdx && t >= nextSched.tStart) {
        const tau = t - nextSched.tStart;
        const p = Spring.stepResponse(tau, 14.0, 0.82);

        let blurPx = 0;
        if (tau >= 0 && tau < 0.35) {
          const triangle = 1.0 - Math.abs(tau - 0.17) / 0.17;
          blurPx = Math.max(0, triangle * 4.0);
        }

        return {
          x: gCur.x + (gNext.x - gCur.x) * p,
          y: gCur.y + (gNext.y - gCur.y) * p,
          w: gCur.w + (gNext.w - gCur.w) * p,
          h: gCur.h + (gNext.h - gCur.h) * p,
          radius: gCur.radius + (gNext.radius - gCur.radius) * p,
          bg: gNext.bg,
          border: gNext.border,
          borderWidth: gCur.borderWidth + (gNext.borderWidth - gCur.borderWidth) * p,
          activeIdx: tau > 0.15 ? nextIdx : prevIdx,
          contentFadeOutIdx: prevIdx,
          contentFadeInIdx: nextIdx,
          transitionTau: tau,
          isTransitioning: tau < 0.45,
          blurPx: blurPx
        };
      }

      return {
        x: gCur.x,
        y: gCur.y,
        w: gCur.w,
        h: gCur.h,
        radius: gCur.radius,
        bg: gCur.bg,
        border: gCur.border,
        borderWidth: gCur.borderWidth,
        activeIdx: prevIdx,
        contentFadeOutIdx: -1,
        contentFadeInIdx: prevIdx,
        transitionTau: 10.0,
        isTransitioning: false,
        blurPx: 0
      };
    }

    function drawRoundedRect(c, x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      c.beginPath();
      c.moveTo(x + r, y);
      c.lineTo(x + w - r, y);
      c.arcTo(x + w, y, x + w, y + r, r);
      c.lineTo(x + w, y + h - r);
      c.arcTo(x + w, y + h, x + w - r, y + h, r);
      c.lineTo(x + r, y + h);
      c.arcTo(x, y + h, x, y + h - r, r);
      c.lineTo(x, y + r);
      c.arcTo(x, y, x + r, y, r);
      c.closePath();
    }

    function drawBackground(c, w, h, t) {
      c.fillStyle = "#090d16";
      c.fillRect(0, 0, w, h);

      const grad = c.createRadialGradient(w / 2, h / 2, 80, w / 2, h / 2, Math.max(w, h) * 0.75);
      grad.addColorStop(0, "rgba(22, 32, 50, 0.4)");
      grad.addColorStop(1, "rgba(9, 13, 22, 1.0)");
      c.fillStyle = grad;
      c.fillRect(0, 0, w, h);

      c.save();
      const safeLeft = 60 * fScale;
      const safeRight = w - 60 * fScale;
      const safeTop = (w > h ? 60 : 90) * fScale;

      c.textBaseline = "top";
      c.fillStyle = "rgba(148, 163, 184, 0.4)";
      c.font = `600 ${Math.round(18 * fScale)}px monospace`;
      c.textAlign = "left";
      ft(c, "HEVI MOTION ARCHITECTURE // " + (spec.title || "STUDIO PIPELINE"), safeLeft, safeTop);

      c.textAlign = "right";
      ft(c, `T+${t.toFixed(2)}s`, safeRight, safeTop);
      c.restore();
    }

    function drawContainerContent(c, geom, sched, alpha, t) {
      if (alpha <= 0.01) return;
      const s = sched.state;
      const cx = geom.x + geom.w / 2;
      const cy = geom.y + geom.h / 2;

      c.save();
      c.globalAlpha = Math.max(0, Math.min(1.0, alpha));

      // 1. Button type: concise horizontal layout
      if (s.type === "button") {
        c.fillStyle = s.accent || "#f59e0b";
        c.beginPath();
        c.arc(geom.x + 36 * fScale, cy, 6 * fScale, 0, Math.PI * 2);
        c.fill();

        c.fillStyle = "#f8fafc";
        c.font = `600 ${Math.round(22 * fScale)}px -apple-system, sans-serif`;
        c.textAlign = "center";
        c.textBaseline = "middle";
        ft(c, (s.title || "").replace(/。/g, ""), cx + 12 * fScale, cy);
        c.restore();
        return;
      }

      // 2. Progress type
      if (s.type === "progress") {
        c.textAlign = "center";
        c.textBaseline = "middle";
        c.fillStyle = s.accent || "#f59e0b";
        c.font = `700 ${Math.round(14 * fScale)}px monospace`;
        ft(c, s.badge || "PROCESSING", cx, geom.y + 36 * fScale);

        c.fillStyle = "#f8fafc";
        c.font = `600 ${Math.round(22 * fScale)}px -apple-system, sans-serif`;
        ft(c, (s.title || "").replace(/。/g, ""), cx, geom.y + 70 * fScale);

        const trackW = geom.w - 100 * fScale;
        const trackH = 12 * fScale;
        const trackX = geom.x + 50 * fScale;
        const trackY = geom.y + 104 * fScale;

        c.fillStyle = "rgba(51, 65, 85, 0.6)";
        drawRoundedRect(c, trackX, trackY, trackW, trackH, 6 * fScale);
        c.fill();

        const pct = Math.min(1.0, (s.progress || 0.75) * Spring.stepResponse(t - sched.tStart, 12.0, 0.85));
        c.fillStyle = s.accent || "#10b981";
        drawRoundedRect(c, trackX, trackY, trackW * pct, trackH, 6 * fScale);
        c.fill();
        c.restore();
        return;
      }

      // Top badge
      if (s.badge) {
        c.fillStyle = s.accent || "#f59e0b";
        c.font = `700 ${Math.round(14 * fScale)}px monospace`;
        c.textAlign = "center";
        c.textBaseline = "middle";
        ft(c, s.badge, cx, geom.y + 36 * fScale);
      }

      // Title
      if (s.title) {
        c.fillStyle = "#f8fafc";
        c.font = `600 ${Math.round(24 * fScale)}px -apple-system, sans-serif`;
        c.textAlign = "center";
        c.textBaseline = "middle";
        ft(c, s.title.replace(/。/g, ""), cx, geom.y + 76 * fScale);
      }

      // 3. Metric type (Big number cleanly separated from title)
      if (s.type === "metric") {
        c.fillStyle = "#ffffff";
        c.font = `800 ${Math.round(72 * fScale)}px monospace`;
        c.textAlign = "center";
        c.textBaseline = "middle";
        ft(c, s.value || "18", cx, geom.y + 195 * fScale);

        if (s.unit) {
          c.fillStyle = s.accent || "#38bdf8";
          c.font = `600 ${Math.round(16 * fScale)}px monospace`;
          ft(c, s.unit, cx, geom.y + 270 * fScale);
        }
      }

      // 4. Chart type (bars strictly constrained below title line)
      else if (s.type === "chart") {
        const bars = s.bars || [0.4, 0.65, 0.9, 0.75, 0.5];
        const barAreaW = geom.w - 120 * fScale;
        const baseY = geom.y + geom.h - 52 * fScale;
        const maxBarH = geom.h - 170 * fScale; // Leaves top 170px for badge + title
        const startX = geom.x + 60 * fScale;
        const slotW = barAreaW / bars.length;
        const barW = slotW * 0.62;

        for (let b = 0; b < bars.length; b++) {
          const bH = bars[b] * maxBarH * Spring.stepResponse(t - sched.tStart - (b * 0.08), 16.0, 0.82);
          const bx = startX + b * slotW + (slotW - barW) / 2;
          const by = baseY - bH;

          c.fillStyle = b === 2 ? (s.accent || "#f59e0b") : "rgba(71, 85, 105, 0.7)";
          drawRoundedRect(c, bx, by, barW, bH, 6 * fScale);
          c.fill();
        }
      }

      // 5. Player preview
      else if (s.type === "player") {
        const playerAreaW = geom.w - 100 * fScale;
        const playX = geom.x + 50 * fScale;
        const playY = geom.y + 260 * fScale;

        const waveCount = 24;
        const wGap = playerAreaW / waveCount;
        for (let i = 0; i < waveCount; i++) {
          const amp = 0.25 + 0.7 * Math.abs(Math.sin((i * 0.45) + t * 2.0));
          const wh = 54 * fScale * amp;
          const wx = playX + i * wGap;
          c.fillStyle = wx < playX + playerAreaW * (s.playhead || 0.65) ? (s.accent || "#e11d48") : "rgba(71, 85, 105, 0.5)";
          drawRoundedRect(c, wx, playY - wh / 2, 4 * fScale, wh, 2 * fScale);
          c.fill();
        }

        const headX = playX + playerAreaW * (s.playhead || 0.65);
        c.strokeStyle = "#ffffff";
        c.lineWidth = 2 * fScale;
        c.beginPath();
        c.moveTo(headX, playY - 42 * fScale);
        c.lineTo(headX, playY + 42 * fScale);
        c.stroke();
      }

      // 6. Generic card detail
      else if (s.detail) {
        c.fillStyle = "rgba(203, 213, 225, 0.85)";
        c.font = `500 ${Math.round(18 * fScale)}px monospace`;
        c.textAlign = "center";
        c.textBaseline = "middle";
        ft(c, s.detail.replace(/。/g, ""), cx, geom.y + 210 * fScale);
      }

      c.restore();
    }

    function drawCursor(c, t, geom) {
      const targetX = geom.x + geom.w / 2;
      const targetY = geom.y + geom.h / 2;
      const clickPulse = Math.sin(t * 3.14159) > 0.8 ? 0.9 : 1.0;

      c.save();
      c.translate(targetX + 50 * fScale, targetY + 20 * fScale);
      c.scale(clickPulse * fScale, clickPulse * fScale);

      c.fillStyle = "#ffffff";
      c.strokeStyle = "#0f172a";
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(16, 16);
      c.lineTo(7, 18);
      c.lineTo(12, 28);
      c.lineTo(6, 30);
      c.lineTo(1, 20);
      c.lineTo(-6, 26);
      c.closePath();
      c.fill();
      c.stroke();
      c.restore();
    }

    window.draw = function (t) {
      ctx.clearRect(0, 0, width, height);
      if (__recordText) { window.__textBoxes = []; window.__containers = []; }

      drawBackground(ctx, width, height, t);

      const geom = computeContainerAtTime(t, width, height);
      window.__containers.push({ x: geom.x, y: geom.y, w: geom.w, h: geom.h });

      ctx.save();
      if (geom.blurPx > 0.5) {
        ctx.filter = `blur(${geom.blurPx.toFixed(1)}px)`;
      }

      // Neutral low-opacity shadow (replaces colored neon halo per H5)
      ctx.shadowColor = "rgba(0, 0, 0, 0.45)";
      ctx.shadowBlur = 14 * fScale;
      ctx.shadowOffsetY = 6 * fScale;
      ctx.fillStyle = geom.bg;
      ctx.strokeStyle = geom.border;
      ctx.lineWidth = geom.borderWidth;

      drawRoundedRect(ctx, geom.x, geom.y, geom.w, geom.h, geom.radius);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
      ctx.stroke();
      ctx.restore();

      if (geom.isTransitioning) {
        const curAlpha = Math.max(0, 1.0 - (geom.transitionTau / 0.15));
        const nextAlpha = Math.max(0, (geom.transitionTau - 0.18) / 0.2);

        if (curAlpha > 0 && geom.contentFadeOutIdx >= 0) {
          drawContainerContent(ctx, geom, stateSchedule[geom.contentFadeOutIdx], curAlpha, t);
        }
        if (nextAlpha > 0 && geom.contentFadeInIdx >= 0) {
          drawContainerContent(ctx, geom, stateSchedule[geom.contentFadeInIdx], nextAlpha, t);
        }
      } else {
        drawContainerContent(ctx, geom, stateSchedule[geom.activeIdx], 1.0, t);
      }

      drawCursor(ctx, t, geom);
    };

    buildSchedule();
  })();
  </script>
</body>
</html>
