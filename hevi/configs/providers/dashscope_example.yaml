# 阿里云 DashScope 示例配置
# 使用方法:
# 1. 复制此文件并重命名: cp dashscope_example.yaml my_dashscope.yaml
# 2. 设置环境变量: export DASHSCOPE_API_KEY=your_api_key
# 3. 重启服务或调用 POST /api/providers/reload 热加载

category: llm
name: dashscope_example
adapter: dashscope
config:
  api_key: "${DASHSCOPE_API_KEY}"  # 从环境变量读取
  model: "qwen-plus"
  temperature: 0.7
  max_tokens: 4096
enabled: true
priority: 5
