# OpenAI 兼容 API 示例配置
# 使用方法:
# 1. 复制此文件并重命名: cp openai_example.yaml my_provider.yaml
# 2. 修改配置参数
# 3. 设置环境变量或直接在 config 中填入 API key
# 4. 重启服务或调用 POST /api/providers/reload 热加载

category: llm
name: openai_compatible_example
adapter: openai_compatible
config:
  base_url: "https://api.openai.com/v1"
  api_key: "${OPENAI_API_KEY}"  # 从环境变量读取
  model: "gpt-4"
  temperature: 0.7
  max_tokens: 4096
  timeout: 120.0
enabled: true
priority: 10
