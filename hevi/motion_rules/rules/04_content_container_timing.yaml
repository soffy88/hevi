id: content_container_timing
title: 内容与容器形变进出时序规范
category: 字排时序
trigger:
  - 容器形态发生变化时的内部文字或图标排版
  - 容器内文案、标签的置换与更新
counter_example: |
  文字在容器开始形变前就提前进场、在容器结束形变后仍然留在旧坐标，或者文字与容器同时机械拉伸变形，导致文字被容器边框裁切遮挡或图文挤压穿帮。
correct_approach: |
  文字必须在容器开始形变之后进场（例如容器已展开到一定比例后再淡入），并在容器下一次开始形变之前提前离场退净，确保文字永远处于形态稳固的容器之中，绝不重叠穿帮。
source_case_id: "2103483957266268381"
source_author: Martijn Verbove (@verbove)
prompt_summary: 内容进出时序严谨：内部文字与图标必须在容器开始形变之后进场，并在容器下一次形变之前彻底离开，严防文字与容器形变挤压重叠。
