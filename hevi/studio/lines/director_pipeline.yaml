id: director_pipeline
product: 导演流水线
summary: 手稿 → 故事图/场面调度/分镜资产 → 时间线，交接短剧整季派发
handoff: shortdrama
render_runtime: remotion
slots:
  - name: manuscript
    required: true
    description: 小说/剧本手稿
  - name: episode_count
    required: false
    description: 目标集数
  - name: subject_ids
    required: false
    description: 已锁定角色
tools:
  - storygraph.extract
  - research.plan
  - director.scene_stage
  - director.h3_cuts
  - score.provider
  - memory.remember
  - memory.recall
  - shot.export
  - asset.bind
  - nle.edit_plan
  - timeline.create
  - profile.freeze
pipeline:
  name: director_pipeline
  stages:
    - name: intake
      fn: hevi.studio.stages:stage_intake
    - name: research
      fn: hevi.studio.stages:stage_research
    - name: score
      fn: hevi.studio.stages:stage_score
    - name: script
      fn: hevi.studio.stages:stage_script
    - name: assets
      fn: hevi.studio.stages:stage_assets
    - name: edit_plan
      fn: hevi.studio.stages:stage_edit_plan
    - name: timeline
      fn: hevi.studio.stages:stage_timeline
    - name: dispatch
      fn: hevi.studio.stages:stage_dispatch
