id: scene3d
product: 3D 风格化场景镜头
summary: 数据驱动的 Three.js 镜头线 —— 漂浮小星球 / 麦田 / 狐狸 / 星空 + UnrealBloom，
  CPU+SwiftShader 离线渲染，9:16 / 16:9 / 1:1 / 21:9 任选一画幅逐帧确定出片。
handoff: scene3d
render_runtime: scene3d
slots:
  - name: topic
    required: true
    description: 主题（自动选择星球/星空/麦田预设并生成旁白）
  - name: preset
    required: false
    description: 可选场景预设（little_planet_orbit | through_star_sea | fox_in_wheat）
  - name: scene
    required: false
    description: 可选场景 JSON 路径（默认按主题选择）
  - name: out
    required: false
    description: 渲染输出目录（默认工单目录）
tools:
  - scene3d.render
  - scene3d.validate
  - scene3d.contact_sheet
pipeline:
  name: scene3d
  stages:
    - name: intake
      fn: hevi.studio.stages:stage_intake
    - name: script
      fn: hevi.studio.stages:stage_script
    - name: dispatch
      fn: hevi.studio.stages:stage_dispatch
