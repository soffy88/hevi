id: shorts_clip
product: 拆条矩阵
summary: 已有成片 → 时间线拆条（不重渲；平台发布已迁至 Easel）
handoff: none
render_runtime: ffmpeg
slots:
  - name: media_path
    required: true
    description: 成片路径
  - name: topic
    required: false
    description: 标题/选题
  - name: platforms
    required: false
    description: 目标平台列表（仅用于打包，发布由 Easel 负责）
tools:
  - clip.factory
  - clip.virality
  - ingest.rough_cut
  - nle.jianying_export
  - nle.style_archive
  - nle.edit_plan
  - timeline.create
  - timeline.ripple
  - delivery.preview
  - asset.bind
pipeline:
  name: shorts_clip
  stages:
    - name: intake
      fn: hevi.studio.stages:stage_intake
    - name: script
      fn: hevi.studio.stages:stage_script
    - name: edit_plan
      fn: hevi.studio.stages:stage_edit_plan
    - name: timeline
      fn: hevi.studio.stages:stage_timeline
    - name: assets
      fn: hevi.studio.stages:stage_assets
    - name: dispatch
      fn: hevi.studio.stages:stage_dispatch
