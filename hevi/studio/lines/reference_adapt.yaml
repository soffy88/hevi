id: reference_adapt
product: 参考片改编
summary: 看片节奏 → 差异化概念 → 脚本/时间线 → 按概念选一条主产线交接
handoff: explainer
render_runtime: remotion
slots:
  - name: transcript
    required: true
    description: 参考片转写或摘要
  - name: duration_s
    required: false
    description: 参考片时长
  - name: topic
    required: false
    description: 改编主题（可覆盖参考片）
tools:
  - ingest.preflight
  - watch.video
  - watch.pacing
  - watch.concepts
  - research.plan
  - score.provider
  - script.from_watch
  - script.quick
  - nle.edit_plan
  - timeline.create
  - asset.bind
pipeline:
  name: reference_adapt
  stages:
    - name: intake
      fn: hevi.studio.stages:stage_intake
    - name: watch
      fn: hevi.studio.stages:stage_watch
    - name: research
      fn: hevi.studio.stages:stage_research
    - name: score
      fn: hevi.studio.stages:stage_score
    - name: script
      fn: hevi.studio.stages:stage_script
    - name: assets
      fn: hevi.studio.stages:stage_assets
    - name: edit_plan
      fn: hevi.studio.stages:stage_edit_plan
    - name: timeline
      fn: hevi.studio.stages:stage_timeline
    - name: dispatch
      fn: hevi.studio.stages:stage_dispatch
