id: collage_broll
product: 半调纸拼贴 B-roll
summary: 句级 B-roll：隐喻卡 → visual-spec → 静帧/动画（procedural/codex）→ GIF+MP4，供 talking_head/explainer 插入。
handoff: none
render_runtime: ffmpeg
slots:
  - name: sentence
    required: true
    description: 口播句子
  - name: mode
    required: false
    description: procedural 或 codex
  - name: out
    required: false
    description: 输出目录
tools:
  - collage_broll.metaphor
  - collage_broll.run
  - collage_broll.render
pipeline:
  name: collage_broll
  stages:
    # 语义/视觉规范在 hevi.collage_broll.capabilities 里随 render 一起生成；
    # 产线阶段只保留异步 dispatch，交给 fulfill 的真实媒体执行器（旧同步
    # stage 会被 PipelineManifest 拒绝，且会在 staging 期就下载 rembg 模型）。
    - name: dispatch
      fn: hevi.studio.stages:stage_dispatch
