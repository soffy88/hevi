id: ai_drama
product: AI 短剧（角色开口说话）
summary: 主题/梗概 → 剧本 → 分镜 → 资产身份板 → 视频段 → 剪辑单 → 9:16 成片；无 key 离线出片
handoff: shortdrama
render_runtime: ffmpeg
slots:
  - name: topic
    required: false
    description: 主题或一句话梗概（与 episode 二选一）
  - name: episode
    required: false
    description: 结构化剧本 JSON（含 characters/scenes/beats）
  - name: style
    required: false
    description: live_action | anime | game_pov | 3d_cg | ink
  - name: video_provider
    required: false
    description: offline | runninghub_h3 | minimax_h3_api（缺 key 自动 offline）
  - name: series_dir
    required: false
    description: 系列目录（含 series.json）；缺省在 output/ai_drama/series 建立
  - name: pov
    required: false
    description: POV=观众即男主，只露手/袖子/鞋，永不露脸
  - name: translate_to
    required: false
    description: 第二语言字幕（如 en / ja）；用已注册 LLM 翻译
tools:
  - drama.series_topics
  - drama.series_beats
  - drama.stage_script
  - drama.stage_storyboard
  - drama.stage_assets
  - drama.stage_voice
  - drama.stage_segments
  - drama.stage_edit
  - drama.stage_publish
  - drama.series_review
pipeline:
  name: ai_drama
  stages:
    - name: script
      fn: hevi.ai_drama.stages:stage_script
    - name: voice
      fn: hevi.ai_drama.stages:stage_voice
    - name: storyboard
      fn: hevi.ai_drama.stages:stage_storyboard
    - name: assets
      fn: hevi.ai_drama.stages:stage_assets
    - name: segments
      fn: hevi.ai_drama.stages:stage_segments
    - name: edit
      fn: hevi.ai_drama.stages:stage_edit
    - name: publish
      fn: hevi.ai_drama.stages:stage_delivery
